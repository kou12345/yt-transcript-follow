<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Transcript Follow</title>
<style>
  :root {
    --bg: #fff; --fg: #1f2328; --muted: #6e7781; --accent: #d1242f; --active: #fff4d6; --border: #d0d7de;
    --ruby: #3b5bdb; --ruby-bg: rgba(59, 91, 219, 0.14); --panel: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --fg: #e6e6e6; --muted: #9a9a9a; --accent: #ff6b6b; --active: #3a3222; --border: #3a3a3a;
      --ruby: #8ab4f8; --ruby-bg: rgba(138, 180, 248, 0.22); --panel: #262626;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.7 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; align-items: center; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--border); }
  #status { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; font-size: 12px; cursor: pointer; flex-shrink: 0; }
  #known-panel { position: sticky; top: 41px; z-index: 1; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); max-height: 36vh; overflow: auto; }
  .known-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
  #known-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 11px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  #list { padding: 0 12px 50vh; }
  h3 { margin: 24px 0 8px; font-size: 15px; }
  .seg { padding: 6px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; }
  .seg.active { background: var(--active); }
  .time { color: var(--accent); font-size: 12px; font-variant-numeric: tabular-nums; }
  .seg p { margin: 2px 0; }
  .seg p.en { color: var(--muted); font-size: 13px; }
  body[data-align="ruby"] .seg p.has-ruby,
  body[data-align="active"] .seg.active p.has-ruby { line-height: 2.2; }
  ruby.vocab { ruby-position: over; border-radius: 3px; transition: background-color 0.1s ease; }
  ruby.vocab rt { font-size: 10px; line-height: 1.1; font-weight: 500; color: var(--ruby); user-select: none; cursor: pointer; padding: 0 2px; border-radius: 3px; transition: opacity 0.12s ease, background-color 0.12s ease; }
  body[data-align="ruby"] .seg:not(.active) ruby.vocab rt { opacity: 0.72; }
  body[data-align="ruby"] .seg.active ruby.vocab rt,
  body[data-align="active"] .seg.active ruby.vocab rt { opacity: 1; }
  ruby.vocab rt:hover { background: var(--ruby-bg); text-decoration: line-through; opacity: 1; }
  ruby.vocab.known rt,
  body[data-align="active"] .seg:not(.active) ruby.vocab rt,
  body[data-align="off"] ruby.vocab rt { display: none; }
  .tok { border-radius: 3px; transition: background-color 0.1s ease, color 0.1s ease; }
  body:not([data-align="off"]) .seg .match { background: var(--ruby-bg); color: var(--fg); }
  #toast { position: fixed; left: 12px; bottom: 12px; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--fg); font-size: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
  #toast[hidden] { display: none; }
  #follow { position: fixed; right: 12px; bottom: 12px; z-index: 3; padding: 6px 12px; border-radius: 16px; }
</style>
</head>
<body data-align="ruby">
<header>
  <span id="status">YouTube の動画を開いてください</span>
  <button id="align" hidden title="英語ルビ表示を切替">ルビ: 常時</button>
  <button id="known-btn" hidden title="覚えた単語（非表示リスト）を管理"></button>
  <button id="grant" hidden></button>
  <button id="pick">Vault を選択</button>
</header>
<div id="known-panel" hidden>
  <div class="known-head">
    <span>覚えた単語（クリックでルビを再表示）</span>
    <button id="known-clear">すべて解除</button>
  </div>
  <div id="known-list"></div>
</div>
<div id="list"></div>
<div id="toast" hidden><span id="toast-msg"></span><button id="undo">元に戻す</button></div>
<button id="follow" hidden>現在位置に戻る</button>
<script src="sidepanel.js"></script>
</body>
</html>
